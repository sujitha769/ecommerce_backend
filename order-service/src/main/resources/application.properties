# Application
spring.application.name=order-service
server.port=8806

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Microservice URLs
services.cart.url=${CART_SERVICE_URL:http://localhost:8805}
services.product.url=${PRODUCT_SERVICE_URL:http://localhost:8801}
services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8803}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8807}