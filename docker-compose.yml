services:
  user-service:
    build: ./user-service
    ports:
      - "8802:8802"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  inventory-service:
    build: ./inventory-service
    ports:
      - "8803:8803"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  product-service:
    build: ./product-service
    ports:
      - "8801:8801"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      INVENTORY_SERVICE_URL: http://inventory-service:8803
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      inventory-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  cart-service:
    build: ./cart-service
    ports:
      - "8805:8805"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8801
      INVENTORY_SERVICE_URL: http://inventory-service:8803
    depends_on:
      - product-service
      - inventory-service
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    ports:
      - "8807:8807"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "8806:8806"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CART_SERVICE_URL: http://cart-service:8805
      PRODUCT_SERVICE_URL: http://product-service:8801
      INVENTORY_SERVICE_URL: http://inventory-service:8803
      PAYMENT_SERVICE_URL: http://payment-service:8807
    depends_on:
      - cart-service
      - product-service
      - inventory-service
      - payment-service
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
